name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # Use --no-frozen-lockfile because pnpm-lock.yaml is not committed.
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run E2E tests
        # Supply dummy values so the dev server can boot during Playwright runs.
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: public-anon-key
          JWT_SECRET: test-secret
          ADMIN_EMAIL: testadmin@example.com
          PAYFAST_MERCHANT_ID: dummy
          PAYFAST_MERCHANT_KEY: dummy
          PAYFAST_PASSPHRASE: dummy-passphrase
          PAYFAST_MODE: sandbox
          PAYFAST_NOTIFY_URL: http://127.0.0.1:8080/api/payfast/ipn
          APP_PUBLIC_URL: http://127.0.0.1:8080
        run: pnpm test:e2e

      - name: Build
        run: pnpm run build
